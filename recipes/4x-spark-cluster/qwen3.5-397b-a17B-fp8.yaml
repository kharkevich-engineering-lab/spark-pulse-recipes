# Imported from eugr/spark-vllm-docker recipes/4x-spark-cluster/qwen3.5-397b-a17B-fp8.yaml
recipe_version: "2"
name: Qwen3.5-397B-A17B-FP8
model: Qwen/Qwen3.5-397B-A17B-FP8
description: >-
  Qwen3.5-397B-A17B in native FP8 with tp=4 across four DGX Spark nodes.
  Multimodal, so the vision encoder is sharded with --mm-encoder-tp-mode data.

engine: vllm

constraints:
  solo_only: false
  # Upstream declares no topology flag, but the recipe lives in the 4x
  # directory and defaults to tp=4, which needs four single-GPU nodes.
  cluster_only: true
  min_nodes: 4

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_batched_tokens: 8192
  max_num_seqs: 32

engines:
  vllm:
    image: vllm-node
    mods:
      # Fixes a ROPE syntax error in the checkpoint config.
      - mods/fix-qwen3.5-autoround
    env:
      VLLM_USE_DEEP_GEMM: "0"
      VLLM_USE_FLASHINFER_MOE_FP16: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      OMP_NUM_THREADS: "4"
    args: >-
      --load-format instanttensor --enable-prefix-caching --enable-auto-tool-choice
      --tool-call-parser qwen3_coder --reasoning-parser qwen3 --trust-remote-code
      --mm-encoder-tp-mode data --kv-cache-dtype fp8
      --compilation-config.cudagraph_mode none --attention-backend flashinfer
  # vLLM only: the recipe needs a vLLM mod to load at all, and uses
  # instanttensor plus vLLM-specific compilation-config flags.

# Upstream also passes --distributed-executor-backend ray; the vLLM engine
# strips it, so it is not carried over.
