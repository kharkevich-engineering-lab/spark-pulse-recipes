# Imported from eugr/spark-vllm-docker recipes/qwen3.6-35b-a3b-fp8-dflash.yaml
recipe_version: "2"
name: Qwen36-35B-A3B
model: Qwen/Qwen3.6-35B-A3B-FP8
description: >-
  Qwen3.6-35B-A3B in native FP8 with the z-lab DFlash draft model for
  speculative decoding, tp=2 and a 256k context. Uses flash_attn rather than
  FlashInfer because the draft path needs it.

engine: vllm

constraints:
  solo_only: false
  cluster_only: false

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 16384

engines:
  vllm:
    image: vllm-node
    mods:
      - mods/fix-qwen3.6-chat-template
    env:
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    args: >-
      --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3
      --load-format fastsafetensors --attention-backend flash_attn
      --chat-template fixed_chat_template.jinja
      --speculative-config '{{"method":"dflash","model":"z-lab/Qwen3.6-35B-A3B-DFlash","num_speculative_tokens":15}}'
  # vLLM only: a vLLM mod supplies the chat template and DFlash speculative
  # decoding is a vLLM --speculative-config method.

# Upstream also passes --distributed-executor-backend ray; the vLLM engine
# strips it, so it is not carried over.
