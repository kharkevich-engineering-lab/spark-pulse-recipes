# Imported from eugr/spark-vllm-docker recipes/8x-spark-cluster/glm-5.2-nvfp4.yaml
recipe_version: "2"
name: GLM-5.2-NVFP4 (TP=8)
model: nvidia/GLM-5.2-NVFP4
description: >-
  GLM-5.2 in NVFP4 with tp=8 across eight DGX Spark nodes, served on the B12X
  build of the Spark vLLM image. Uses the sparse-indexer MLA attention path
  and an MTP draft; gpu_memory_utilization is tuned to 0.726 for a 256k
  context.

engine: vllm

constraints:
  solo_only: false
  cluster_only: true
  min_nodes: 8

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 8
  pipeline_parallel: 1
  gpu_memory_utilization: 0.726
  max_model_len: 262144
  max_num_batched_tokens: 4096
  max_num_seqs: 8

engines:
  vllm:
    # B12X kernels are only in the b12x image, not the default vllm-node one.
    image: vllm-node-b12x
    env:
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_DCP_QUERY_SPLIT: "0"
      VLLM_B12X_MLA_CKV_GATHER: "1"
      CUTE_DSL_ARCH: sm_121a
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_B12X_SPARSE_INDEXER: "1"
      GLM52_BIND_HOST_TRITON: "0"
      VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"
    args: >-
      --trust-remote-code --reasoning-parser glm45 --tool-call-parser glm47
      --enable-auto-tool-choice --enable-chunked-prefill --enable-prefix-caching
      --async-scheduling --decode-context-parallel-size 1
      --dcp-kv-cache-interleave-size 1 --attention-backend B12X_MLA_SPARSE
      --hf-overrides '{{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}}'
      --long-prefill-token-threshold 2048 --kv-cache-dtype fp8
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}'
      --default-chat-template-kwargs '{{"reasoning_effort":"high","clear_thinking":false}}'
      --speculative-config '{{"method":"mtp","quantization":"compressed-tensors","attention_backend":"B12X_MLA_SPARSE","num_speculative_tokens":4,"draft_tensor_parallel_size":1}}'
      --seed 42 --load-format instanttensor --no-enable-flashinfer-autotune
  # vLLM only, decisively: the B12X sparse-indexer attention backend and the
  # vllm-node-b12x image have no counterpart outside vLLM.

# Upstream also passes --distributed-executor-backend ray; the vLLM engine
# strips it, so it is not carried over. Upstream's decode_context_parallel,
# dcp_kv_cache_interleave_size, long_prefill_token_threshold and
# num_speculative_tokens defaults are vLLM-specific, so their values are
# inlined into the args above rather than exposed as engine-neutral params.
