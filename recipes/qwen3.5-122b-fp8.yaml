# Imported from eugr/spark-vllm-docker recipes/qwen3.5-122b-fp8.yaml
recipe_version: "2"
name: Qwen3.5-122B-FP8
model: Qwen/Qwen3.5-122B-A10B-FP8
description: >-
  Qwen3.5-122B-A10B in native FP8 with tp=2 and a 256k context. The chat
  template comes from a vLLM mod rather than the checkpoint.

engine: vllm

constraints:
  solo_only: false
  cluster_only: true

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 8192

engines:
  vllm:
    image: vllm-node
    mods:
      - mods/fix-qwen3.5-chat-template
    args: >-
      --load-format instanttensor --enable-prefix-caching --enable-auto-tool-choice
      --tool-call-parser qwen3_coder --reasoning-parser qwen3
      --chat-template unsloth.jinja
  # vLLM only: --chat-template unsloth.jinja resolves to a file the
  # fix-qwen3.5-chat-template mod installs into the vLLM container, and the
  # weights load through instanttensor.

# Upstream also passes --distributed-executor-backend ray; the vLLM engine
# strips it, so it is not carried over.
