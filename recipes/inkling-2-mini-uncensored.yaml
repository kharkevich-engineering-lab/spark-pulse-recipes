# Based on OpenUncensored's model card (read 2026-11-22):
# https://huggingface.co/OpenUncensored/Inkling-2-Mini-Uncensored
#
# The checkpoint is Thinking Machines' 26B-total / 3.4B-active vision MoE,
# with NVFP4 and MXFP8 experts and a 1M-token native context. Its publisher
# explicitly recommends SGLang's dedicated Inkling image on a DGX Spark.
recipe_version: "2"
name: Inkling-2-Mini-Uncensored
model: OpenUncensored/Inkling-2-Mini-Uncensored
description: >-
  OpenUncensored's refusal-abliterated Inkling 2 Mini: a 26B-total, 3.4B-active
  multimodal MoE with a 1M-token context. Runs on one DGX Spark using SGLang's
  dedicated Inkling 2 Mini image, with vision, reasoning, and tool-call parsing.

# The engine variant is part of the recipe because the model needs SGLang's
# model-specific Inkling image rather than the generic SGLang wrapper.
engine: sglang/inkling-2-mini

constraints:
  solo_only: true
  cluster_only: false

params:
  port: 30000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 1000000
  # 48, not 8. Requests past the cap queue for a free slot: at 16 concurrent
  # requests a cap of 8 held half of them back (mean TTFT 31-37 s) while 48
  # starts all of them in about a second. 48 is SGLang's own default once
  # speculative decoding is on.
  max_num_seqs: 48

engines:
  sglang:
    args: >-
      --attention-backend fa4 --dtype bfloat16 --page-size 128
      --enable-multimodal --reasoning-parser inkling --tool-call-parser inkling2
      --speculative-algorithm DSPARK

# DSPARK turns on the speculator the checkpoint bundles (mtp.safetensors);
# SGLang finds it in the model path, and the draft block (gamma 7) is fixed by
# the checkpoint. Measured with the Uncensored weights on one DGX Spark (2026-11-23):
# decode 37 -> 45-51 tok/s for one stream and 15 -> 24 tok/s at 285K context,
# about even at 4-8 streams (74/118 tok/s total against 78/111).
