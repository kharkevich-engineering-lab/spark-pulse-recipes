# Based on Thinking Machines' model card (read 2026-11-22):
# https://huggingface.co/thinkingmachines/Inkling-2-Mini
#
# Inkling 2 Mini is a 26.4B-total / 3.4B-active vision MoE in mixed NVFP4 and
# MXFP8 precision. The model card identifies one NVIDIA DGX Spark as a
# supported inference target and documents SGLang support.
recipe_version: "2"
name: Inkling-2-Mini
model: thinkingmachines/Inkling-2-Mini
description: >-
  Thinking Machines' 26.4B-total, 3.4B-active multimodal Inkling 2 Mini MoE
  with a 1M-token context. Runs on one DGX Spark using SGLang's dedicated
  Inkling 2 Mini image, with vision, reasoning, and tool-call parsing.

engine: sglang/inkling-2-mini

constraints:
  solo_only: true
  cluster_only: false

params:
  port: 30000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 1000000
  # 48, not 8. Requests past the cap queue for a free slot: at 16 concurrent
  # requests a cap of 8 held half of them back (mean TTFT 31-37 s) while 48
  # starts all of them in about a second. 48 is SGLang's own default once
  # speculative decoding is on.
  max_num_seqs: 48

engines:
  sglang:
    args: >-
      --attention-backend fa4 --dtype bfloat16 --page-size 128
      --enable-multimodal --reasoning-parser inkling --tool-call-parser inkling2
      --speculative-algorithm DSPARK

# DSPARK turns on the speculator the checkpoint bundles (mtp.safetensors);
# SGLang finds it in the model path, and the draft block (gamma 7) is fixed by
# the checkpoint. Measured on Inkling-2-Mini-Uncensored, whose speculator
# is byte for byte this checkpoint's (one DGX Spark: 37 -> 45-51 tok/s for one
# stream, about even at 4-8); not re-measured on these weights.
