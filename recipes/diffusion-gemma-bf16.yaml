# Imported from eugr/spark-vllm-docker recipes/diffusion-gemma-bf16.yaml
recipe_version: "2"
name: Diffusion-Gemma-BF16
model: google/diffusiongemma-26B-A4B-it
description: >-
  DiffusionGemma-26B-A4B-IT in BF16 on a single node, thinking off. Uses the
  fixed chat template shipped by the diffusiongemma mod.

engine: vllm

constraints:
  solo_only: true
  cluster_only: false

params:
  port: 8000
  host: 0.0.0.0
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_seqs: 10

engines:
  vllm:
    image: vllm-node
    mods:
      - mods/diffusiongemma
    args: >-
      --trust-remote-code --enable-auto-tool-choice --tool-call-parser gemma4
      --load-format fastsafetensors --attention-backend TRITON_ATTN
      --enable-prefix-caching --diffusion-config '{{"canvas_length":256}}'
      --override-generation-config '{{"max_new_tokens": null}}'
      --chat-template fixed_chat_template.jinja
      --reasoning-parser gemma4
      --default-chat-template-kwargs '{{"enable_thinking": false}}' --moe-backend triton
  # vLLM only: diffusion decoding needs the mods/diffusiongemma patch and
  # vLLM's --diffusion-config. SGLang has no diffusion decoding path and no
  # mod mechanism.
