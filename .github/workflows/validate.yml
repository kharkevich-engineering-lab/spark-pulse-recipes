name: validate

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'schemas/**'
      - 'recipes/**'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'schemas/**'
      - 'recipes/**'

jobs:
  validate:
    name: Validate recipe schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      # Validates every recipe in the tree, subdirectories included, and
      # reports each failure rather than stopping at the first.
      - name: Validate recipes
        run: node packages/validate/index.mjs

      - name: Build the inventory
        run: node packages/inventory/index.mjs

      - name: Build the publish manifest
        run: node packages/publish/index.mjs --dry-run
