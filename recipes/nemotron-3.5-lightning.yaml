# Imported from eugr/spark-vllm-docker recipes/nemotron-3.5-lightning.yaml
# Upstream note: tp=1 on a solo Spark, tp=2 in a cluster (the default below).
recipe_version: "2"
name: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
description: >-
  Nemotron 3.5 Lightning 30B-A3B in NVFP4 with the matching DSpark speculative
  draft model. A Mamba hybrid served through vLLM's FlashInfer mamba backend
  with stochastic rounding; the 1M context is the model's own maximum.

engine: vllm

constraints:
  solo_only: false
  cluster_only: false

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  max_model_len: 1048576
  max_num_batched_tokens: 16384

engines:
  vllm:
    image: vllm-node
    args: >-
      --moe-backend marlin --kv-cache-dtype fp8 --speculative_config.method dspark
      --speculative_config.model nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
      --speculative_config.num_speculative_tokens 7 --mamba-backend flashinfer
      --mamba-ssm-cache-dtype float16 --enable-mamba-cache-stochastic-rounding
      --mamba-cache-philox-rounds 5 --enable-prefix-caching --mamba-cache-mode align
      --reasoning-parser nemotron_v3 --enable-auto-tool-choice
      --tool-call-parser qwen3_xml --load-format instanttensor
  # vLLM only: the DSpark speculative method, vLLM's mamba backend and cache
  # controls, and instanttensor loading.

# num_speculative_tokens is vLLM-specific and is inlined into the args.
