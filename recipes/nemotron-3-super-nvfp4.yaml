# Imported from eugr/spark-vllm-docker recipes/nemotron-3-super-nvfp4.yaml
recipe_version: "2"
name: Nemotron-3-Super-NVFP4-CUTLASS-Optimized
model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
description: >-
  Nemotron-3-Super-120B-A12B in NVFP4 through vLLM's CUTLASS NVFP4 MoE kernels,
  tp=2. A Mamba hybrid, so the SSM cache is forced to float32; the 256k context
  exceeds the declared maximum, hence VLLM_ALLOW_LONG_MAX_MODEL_LEN.

engine: vllm

constraints:
  solo_only: false
  cluster_only: false

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_seqs: 10

engines:
  vllm:
    image: vllm-node
    env:
      VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    args: >-
      --kv-cache-dtype fp8 --moe-backend cutlass --trust-remote-code
      --enable-prefix-caching --enable-auto-tool-choice --load-format instanttensor
      --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3
      --mamba_ssm_cache_dtype float32 --attention-backend TRITON_ATTN
  # vLLM only: instanttensor loading, vLLM's CUTLASS NVFP4 MoE backend and
  # vLLM's mamba SSM cache controls.

# Upstream also passes --distributed-executor-backend ray; the vLLM engine
# strips it, so it is not carried over.
