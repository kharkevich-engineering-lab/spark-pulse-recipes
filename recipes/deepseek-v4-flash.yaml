# Imported from eugr/spark-vllm-docker recipes/deepseek-v4-flash.yaml
recipe_version: "2"
name: DeepSeek-V4-Flash
model: deepseek-ai/DeepSeek-V4-Flash
description: >-
  DeepSeek V4 Flash on a DGX Spark cluster with the stock vllm-node image,
  using sparse MLA and the experimental SM120 DeepGEMM path. The 500k context
  exceeds what the config declares, hence VLLM_ALLOW_LONG_MAX_MODEL_LEN.

engine: vllm

constraints:
  solo_only: false
  cluster_only: true

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 500000
  max_num_batched_tokens: 8192
  max_num_seqs: 4

engines:
  vllm:
    image: vllm-node
    env:
      DG_JIT_USE_NVRTC: "0"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
    args: >-
      --trust-remote-code --kv-cache-dtype fp8 --block-size 256
      --enable-prefix-caching
      --speculative-config '{{"method":"mtp","num_speculative_tokens":2}}'
      --tokenizer-mode deepseek_v4 --tool-call-parser deepseek_v4
      --enable-auto-tool-choice --reasoning-parser deepseek_v4
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}'
      --default-chat-template-kwargs.thinking=true
      --default-chat-template-kwargs.reasoning_effort=high
      --load-format instanttensor
  # vLLM only: instanttensor loading, vLLM's deepseek_v4 tokenizer mode and a
  # vLLM MTP speculative config.

# Upstream also passes --distributed-executor-backend ray; the vLLM engine
# strips it, so it is not carried over. block_size and num_speculative_tokens
# are vLLM-specific and are inlined into the args.
