# Converted in place from this repo's own v1 copy of the upstream
# eugr/spark-vllm-docker recipes/nemotron-3-nano-nvfp4.yaml.
# SINGLE NODE ONLY: upstream reports that cluster mode fails outright.
recipe_version: "2"
name: Nemotron-3-Nano-NVFP4
model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
description: >-
  Nemotron-3-Nano-30B-A3B in NVFP4 on one GB10, served through vLLM's CUTLASS
  MoE backend with an FP8 KV cache. Cluster mode is known to fail for this
  checkpoint, so the recipe is pinned to a single node.

engine: vllm

constraints:
  solo_only: true
  cluster_only: false

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.7
  max_model_len: 262144

engines:
  vllm:
    image: vllm-node
    mods:
      - mods/nemotron-nano
    args: >-
      --moe-backend cutlass --trust-remote-code --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser-plugin nano_v3_reasoning_parser.py
      --reasoning-parser nano_v3 --kv-cache-dtype fp8 --enable-prefix-caching
      --load-format fastsafetensors
  # vLLM only: the mods/nemotron-nano patch and --reasoning-parser-plugin,
  # which loads a Python file into the vLLM process. SGLang has neither.
