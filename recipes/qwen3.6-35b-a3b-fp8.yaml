# Imported from eugr/spark-vllm-docker recipes/qwen3.6-35b-a3b-fp8.yaml
recipe_version: "2"
name: Qwen36-35B-A3B
model: Qwen/Qwen3.6-35B-A3B-FP8
description: >-
  Qwen3.6-35B-A3B in native FP8 with tp=2, a 256k context, FlashInfer attention
  and an FP8 KV cache.

engine: vllm

constraints:
  solo_only: false
  cluster_only: false

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 16384

engines:
  vllm:
    image: vllm-node
    mods:
      - mods/fix-qwen3.6-chat-template
    env:
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    args: >-
      --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3
      --kv-cache-dtype fp8 --load-format fastsafetensors --attention-backend flashinfer
      --enable-prefix-caching --chat-template fixed_chat_template.jinja
  # vLLM only: --chat-template fixed_chat_template.jinja names a file the
  # fix-qwen3.6-chat-template mod installs, and SGLang cannot apply mods.

# Upstream also passes --distributed-executor-backend ray; the vLLM engine
# strips it, so it is not carried over.
