# Imported from eugr/spark-vllm-docker recipes/qwen3.5-397b-int4-autoround.yaml
# Upstream notes: EXPERIMENTAL. Memory is budgeted in GiB, not as a fraction,
# and it needs no-Ray mode to fit the full context on two Sparks. If a node
# shuts down, cap its GPU clocks: `sudo nvidia-smi -lgc 200,2150`.
recipe_version: "2"
name: Qwen3.5-397B-INT4-Autoround
model: Intel/Qwen3.5-397B-A17B-int4-AutoRound
description: >-
  Qwen3.5-397B-A17B in Intel INT4-AutoRound squeezed onto two Sparks at tp=2
  with a 256k context. Experimental: it budgets GPU memory in GiB through the
  gpu-mem-util-gb mod, preallocates a fixed KV cache, and drops the page cache
  before loading.

engine: vllm

constraints:
  solo_only: false
  cluster_only: true

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  max_model_len: 262144
  max_num_batched_tokens: 4176
  max_num_seqs: 2

engines:
  vllm:
    image: vllm-node
    mods:
      - mods/fix-qwen3.5-chat-template
      - mods/gpu-mem-util-gb
      - mods/kv-cache-prealloc-cleanup
      - mods/drop-caches
    env:
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    args: >-
      --kv-cache-dtype fp8 --gpu-memory-utilization-gb 108
      --kv-cache-memory-bytes 2415919104 --enable-prefix-caching
      --enable-auto-tool-choice --tool-call-parser qwen3_xml
      --reasoning-parser qwen3 --trust-remote-code --chat-template unsloth.jinja
      --load-format instanttensor
  # vLLM only: four vLLM mods, instanttensor loading and the GiB memory budget.

# Upstream's gpu_memory_utilization default is 108 — that is GiB, not a
# fraction, because mods/gpu-mem-util-gb replaces the flag with
# --gpu-memory-utilization-gb. It therefore cannot live in the engine-neutral
# params (which mean a 0-1 fraction on every engine) and stays literal in the
# vLLM args, together with kv_cache_memory_bytes.
#
# Upstream also passes --distributed-executor-backend ray; the vLLM engine
# strips it, so it is not carried over.
