# Imported from eugr/spark-vllm-docker recipes/qwen3.5-122b-int4-autoround.yaml
recipe_version: "2"
name: Qwen3.5-122B-INT4-Autoround
model: Intel/Qwen3.5-122B-A10B-int4-AutoRound
description: >-
  Qwen3.5-122B-A10B in Intel INT4-AutoRound with tp=2 and a 256k context.
  Served through vLLM's Marlin kernels with atomic-add accumulation.

engine: vllm

constraints:
  solo_only: false
  cluster_only: false

params:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 8192

engines:
  vllm:
    image: vllm-node
    mods:
      - mods/fix-qwen3.5-chat-template
    env:
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    args: >-
      --load-format instanttensor --enable-prefix-caching --enable-auto-tool-choice
      --tool-call-parser qwen3_xml --reasoning-parser qwen3 --trust-remote-code
      --chat-template unsloth.jinja
  # vLLM only: the chat template is installed by a vLLM mod, the weights load
  # through instanttensor, and INT4-AutoRound is a vLLM Marlin path.

# Upstream also passes --distributed-executor-backend ray; the vLLM engine
# strips it, so it is not carried over.
